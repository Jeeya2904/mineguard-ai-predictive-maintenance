name: MineGuard CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python model/train_model.py
      - run: python -c "from app import app; c=app.test_client(); assert c.get('/api/health').status_code==200"
